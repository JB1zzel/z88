<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spectranext Site</title>
    <style>
        body {
            background-color: black;
            color: #00ff00; /* Green text */
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .message {
            border: 2px solid #00ff00;
            padding: 30px;
            max-width: 600px;
        }
        h1 {
            color: #ffffff;
        }
        a {
            color: #00ffff;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>🖥️ ZX Spectrum Content</h1>
        <p>This site is designed to be viewed on a <strong>Spectranext</strong> or <strong>Spectranet</strong> enabled ZX Spectrum.</p>
        <p>If you're on a Spectrum, mount this site with:</p>
        <code>%mount "https://jb1zzel.github.io/z88/"</code>
        <hr>
        <p style="font-size: 0.8em; color: #aaaaaa;">
            For a list of files, visit <a href="https://github.com/JB1zzel/z88">the GitHub repository</a>.
        </p>
    </div>
</body>
</html>
